# Remote project configuration, pushed with `supabase config push`.
project_id = "etcmfxrcukgukssqaias"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/admin/login",
  "https://www.onemanagency.be/admin/login",
]

[auth.email]
# Signups are closed: the CMS has exactly one account (decision D5), created
# manually. Sign-IN must stay possible, and the provider's on/off switch is NOT
# managed here — `config push` ignores an `enabled` key. It lives in the
# dashboard under Authentication > Sign In / Providers > Email.
#
# Note: setting `enable_signup` under [auth] (rather than [auth.email]) is a
# GLOBAL flag and also switches the email provider off, locking everyone out.
# Keep it scoped to [auth.email], as below.
enable_signup = false
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

# The recovery mail carries a one-time code instead of a link, so the reset can
# be completed on the screen where it was started. Pushed with `config push`.
[auth.email.template.recovery]
subject = "Je code om een nieuw wachtwoord in te stellen"
content_path = "./supabase/templates/recovery.html"

# ── mail delivery ────────────────────────────────────────────────────────────
#
# Custom SMTP, for two reasons rather than one. Supabase's built-in mail only
# reaches addresses on the project team and is capped at roughly two messages an
# hour, which breaks a one-time code the moment someone asks for a second one.
# And on the free tier the recovery template cannot be changed at all while the
# default provider is in use -- so without this, the mail keeps sending a link
# and the code box can never be filled.
#
# Brevo verifies a single sender address by email, so mail can come from
# info@onemanagency.be without DNS changes, which matters while that domain is
# still served elsewhere.
#
# The key is read from the environment and never committed.
[auth.email.smtp]
enabled = true
host = "smtp-relay.brevo.com"
port = 587
user = "env(BREVO_SMTP_USER)"
pass = "env(BREVO_SMTP_KEY)"
admin_email = "env(MAIL_FROM)"
sender_name = "One Man Agency"
